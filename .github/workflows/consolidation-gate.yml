name: Consolidation gate

# Verifies what this repository actually contains: the Conductor publishing
# mechanism and the conductor-pocket PWA. It previously ran the Biologix build
# and test suite, which moved to alexmwein/peptide along with the project. The
# job name is unchanged because branch protection on main requires the
# "Verify combined branch" context.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: consolidation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify combined branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request merge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Conductor publishing scripts
        run: zsh .conductor/tests/publishing-scripts.test.zsh

      - name: conductor-pocket checks
        working-directory: tools/conductor-pocket
        run: |
          npm ci --no-audit --no-fund
          npm run check
