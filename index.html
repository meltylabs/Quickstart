<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
        --steam: #c9c9c7;
        --button-hover: #fff;
        --night-opacity: 0;
      }

      [data-theme="night"] {
        color-scheme: dark;
        --ink: #f4f0df;
        --muted: #b8c2d8;
        --faint: rgba(244, 240, 223, 0.2);
        --paper: #07111f;
        --panel: rgba(11, 22, 38, 0.72);
        --accent: #f8da7a;
        --steam: #9eb0c9;
        --button-hover: rgba(23, 42, 68, 0.92);
        --night-opacity: 1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 120%, rgba(255, 214, 133, 0.12), transparent 38%),
          var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
        transition:
          background-color 240ms ease,
          color 240ms ease;
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .hero {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .night-details {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        opacity: var(--night-opacity);
        pointer-events: none;
        transition: opacity 450ms ease;
      }

      .stars,
      .stars::before,
      .stars::after {
        position: absolute;
        inset: 0;
        content: "";
        background-repeat: repeat;
      }

      .stars {
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.86) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(248, 218, 122, 0.62) 0 1px, transparent 1.5px);
        background-position:
          6vw 9vh,
          24vw 18vh;
        background-size:
          26vw 24vh,
          34vw 28vh;
      }

      .stars::before {
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.54) 0 1px,
          transparent 1.5px
        );
        background-position: 14vw 4vh;
        background-size: 30vw 22vh;
        opacity: 0.7;
      }

      .stars::after {
        background-image: radial-gradient(
          circle,
          rgba(179, 209, 255, 0.56) 0 1px,
          transparent 1.5px
        );
        background-position: 9vw 20vh;
        background-size: 44vw 32vh;
        opacity: 0.45;
      }

      .moon {
        position: absolute;
        top: clamp(28px, 7vh, 70px);
        left: clamp(26px, 8vw, 92px);
        width: clamp(48px, 8vw, 82px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #f8da7a;
        box-shadow:
          0 0 26px rgba(248, 218, 122, 0.44),
          inset -12px -8px 0 rgba(218, 171, 74, 0.22);
      }

      .moon::after {
        position: absolute;
        top: 8%;
        left: 28%;
        width: 100%;
        aspect-ratio: 1;
        content: "";
        border-radius: inherit;
        background: #07111f;
      }

      .horizon {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 25vh;
        background:
          linear-gradient(90deg, transparent 0 10%, rgba(248, 218, 122, 0.2) 10% 11%, transparent 11% 20%, rgba(248, 218, 122, 0.16) 20% 21%, transparent 21% 34%, rgba(248, 218, 122, 0.18) 34% 35%, transparent 35% 100%),
          linear-gradient(to top, rgba(1, 7, 14, 0.92), rgba(1, 7, 14, 0.42) 54%, transparent);
        clip-path: polygon(0 44%, 8% 38%, 18% 48%, 31% 34%, 42% 43%, 54% 30%, 66% 42%, 78% 34%, 90% 48%, 100% 40%, 100% 100%, 0 100%);
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 3;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 1;
        color: var(--steam);
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }

      .theme-toggle,
      .mute-toggle {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .theme-toggle:hover,
      .mute-toggle:hover {
        background: var(--button-hover);
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .theme-toggle:focus-visible,
      .mute-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body data-theme="day">
    <main id="dispatcher">
      <div class="night-details" aria-hidden="true">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="horizon"></div>
      </div>

      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <div class="controls">
        <button
          class="theme-toggle"
          id="theme"
          type="button"
          aria-label="Switch to night mode"
          aria-pressed="false"
        >
          🌙
        </button>
        <button
          class="mute-toggle"
          id="mute"
          type="button"
          aria-label="Mute"
          aria-pressed="false"
        >
          🔊
        </button>
      </div>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const themeButton = document.querySelector("#theme");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      let savedTheme = localStorage.getItem("wtc:theme");
      let nightMode = savedTheme ? savedTheme === "night" : systemTheme.matches;

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function syncThemeButton({ persist = false } = {}) {
        document.body.dataset.theme = nightMode ? "night" : "day";
        themeButton.textContent = nightMode ? "☀️" : "🌙";
        themeMeta.setAttribute("content", nightMode ? "#07111f" : "#ffffff");
        themeButton.setAttribute(
          "aria-label",
          nightMode ? "Switch to day mode" : "Switch to night mode",
        );
        themeButton.setAttribute("aria-pressed", String(nightMode));
        if (persist) {
          savedTheme = nightMode ? "night" : "day";
          localStorage.setItem("wtc:theme", savedTheme);
        }
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });
      themeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        nightMode = !nightMode;
        syncThemeButton({ persist: true });
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        } else if (event.key === "n" || event.key === "N") {
          nightMode = !nightMode;
          syncThemeButton({ persist: true });
        }
      });

      systemTheme.addEventListener("change", (event) => {
        if (savedTheme) return;
        nightMode = event.matches;
        syncThemeButton();
      });

      syncThemeButton();
      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
