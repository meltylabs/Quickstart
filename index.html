<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="CONDUCTOR" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>CONDUCTOR</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.82);
        --accent: #111;
        --header-h: 52px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
      }

      /* ── Header ─────────────────────────────────────────── */

      .game-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        height: var(--header-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 0 16px;
        gap: 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--faint);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
      }

      .header-logo {
        font-size: 20px;
        line-height: 1;
      }

      .header-title {
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .header-stats {
        display: flex;
        gap: 24px;
        align-items: center;
        justify-content: center;
        flex: 1;
      }

      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .stat-label {
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
        line-height: 1.3;
      }

      .stat-value {
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        transition: color 200ms ease;
      }

      .stat-value.rank-value {
        font-family: inherit;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .stat-value.bump {
        animation: stat-bump 300ms ease;
      }

      @keyframes stat-bump {
        0% { transform: scale(1); }
        40% { transform: scale(1.28); color: var(--ink); }
        100% { transform: scale(1); }
      }

      /* ── Mute button ─────────────────────────────────────── */

      .mute-toggle {
        display: inline-flex;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 15px;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .mute-toggle:hover {
        background: #fff;
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .mute-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      /* ── Main ────────────────────────────────────────────── */

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Hero / title screen ─────────────────────────────── */

      .hero {
        position: absolute;
        inset: var(--header-h) 0 0;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
        transition: opacity 500ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 14px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .hero-title {
        margin: 0;
        font-size: clamp(32px, 7vw, 56px);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        line-height: 1;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        line-height: 1.5;
      }

      .hero-best {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .hero-best.visible {
        opacity: 1;
      }

      /* ── Trains ──────────────────────────────────────────── */

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      /* ── Steam ───────────────────────────────────────────── */

      .steam {
        position: fixed;
        z-index: 0;
        color: #c9c9c7;
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      /* ── Milestone overlay ───────────────────────────────── */

      .milestone {
        position: fixed;
        inset: var(--header-h) 0 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 245, 180, 0.92) 0%,
          rgba(255, 220, 100, 0.72) 55%,
          rgba(255, 200, 50, 0) 100%
        );
        backdrop-filter: blur(2px);
      }

      .milestone.show {
        animation: milestone-pop 3000ms ease forwards;
      }

      .milestone-count {
        font-size: clamp(52px, 14vw, 108px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .milestone-label {
        font-size: clamp(15px, 2.5vw, 22px);
        color: var(--muted);
        font-weight: 500;
      }

      /* ── Keyframes ───────────────────────────────────────── */

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @keyframes milestone-pop {
        0% {
          opacity: 0;
          transform: scale(0.4);
        }

        18% {
          opacity: 1;
          transform: scale(1.08);
        }

        28% {
          transform: scale(0.96);
        }

        38% {
          opacity: 1;
          transform: scale(1);
        }

        70% {
          opacity: 1;
          transform: scale(1);
        }

        100% {
          opacity: 0;
          transform: scale(0.88) translateY(-12px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        .milestone.show {
          animation: milestone-fade 3000ms ease forwards;
        }

        @keyframes milestone-fade {
          0%,
          100% {
            opacity: 0;
          }

          15%,
          75% {
            opacity: 1;
          }
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <header class="game-header">
      <div class="header-brand">
        <span class="header-logo" aria-hidden="true">🚂</span>
        <span class="header-title">Conductor</span>
      </div>

      <div class="header-stats" role="status" aria-live="polite" aria-atomic="true">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="score-display">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="hiscore-display">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Rank</span>
          <span class="stat-value rank-value" id="rank-display">—</span>
        </div>
      </div>

      <button
        class="mute-toggle"
        id="mute"
        type="button"
        aria-label="Mute"
        aria-pressed="false"
      >🔊</button>
    </header>

    <main id="dispatcher">
      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <h1 class="hero-title">Conductor</h1>
          <span class="tagline">Click anywhere to dispatch a train.</span>
          <span class="hero-best" id="hero-best">Best: 0</span>
        </div>
      </div>

      <div class="milestone" id="milestone" aria-live="assertive" aria-atomic="true"></div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const RANKS = [
        [0,   "—"],
        [1,   "Trainee"],
        [10,  "Brakeman"],
        [25,  "Fireman"],
        [50,  "Engineer"],
        [100, "Conductor"],
        [200, "Stationmaster"],
      ];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const muteButton = document.querySelector("#mute");
      const milestone = document.querySelector("#milestone");
      const scoreDisplay = document.querySelector("#score-display");
      const hiscoreDisplay = document.querySelector("#hiscore-display");
      const rankDisplay = document.querySelector("#rank-display");
      const heroBest = document.querySelector("#hero-best");
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let hiScore = parseInt(localStorage.getItem("wtc:hiscore") || "0", 10);
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function getRank(n) {
        let rank = RANKS[0][1];
        for (const [threshold, label] of RANKS) {
          if (n >= threshold) rank = label;
        }
        return rank;
      }

      function bump(el) {
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
        el.addEventListener("animationend", () => el.classList.remove("bump"), { once: true });
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function updateHUD() {
        const prevRank = rankDisplay.textContent;
        const rank = getRank(count);

        scoreDisplay.textContent = String(count);
        bump(scoreDisplay);
        rankDisplay.textContent = rank;
        if (rank !== prevRank && count > 0) bump(rankDisplay);

        if (count > hiScore) {
          hiScore = count;
          localStorage.setItem("wtc:hiscore", String(hiScore));
          hiscoreDisplay.textContent = String(hiScore);
          bump(hiscoreDisplay);
        }

        heroBest.textContent = `Best: ${hiScore}`;
        if (hiScore > 0) heroBest.classList.add("visible");

        document.title = count === 0 ? "CONDUCTOR" : `CONDUCTOR (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function showMilestone(n) {
        const MILESTONE_EMOJIS = ["🎉", "🚂", "🎊", "🚀", "⭐", "🏆"];
        const emoji = MILESTONE_EMOJIS[Math.floor((n / 10 - 1) % MILESTONE_EMOJIS.length)];
        milestone.innerHTML =
          `<span class="milestone-count">${emoji} ${n} ${emoji}</span>` +
          `<span class="milestone-label">${n} trains dispatched!</span>`;
        milestone.classList.remove("show");
        void milestone.offsetWidth;
        milestone.classList.add("show");
        milestone.addEventListener("animationend", () => milestone.classList.remove("show"), { once: true });
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateHUD();
        if (count % 10 === 0) showMilestone(count);
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        }
      });

      syncMuteButton();
      hiscoreDisplay.textContent = String(hiScore);
      if (hiScore > 0) {
        heroBest.textContent = `Best: ${hiScore}`;
        heroBest.classList.add("visible");
      }
      updateHUD();
    </script>
  </body>
</html>
