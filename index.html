<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
        --sky: #fbfbfa;
        --steam: #c9c9c7;
        --hover-panel: #fff;
        --hover-border: #b8b8b8;
        --train-glow: 0 0 0 transparent;
        --moon-opacity: 0;
        --stars-opacity: 0;
      }

      :root[data-theme="night"] {
        color-scheme: dark;
        --ink: #f3f7ff;
        --muted: #aeb8cc;
        --faint: rgba(202, 215, 242, 0.24);
        --paper: #07111f;
        --panel: rgba(12, 20, 35, 0.74);
        --accent: #d9e6ff;
        --sky:
          radial-gradient(circle at 76% 18%, rgba(255, 223, 139, 0.16), transparent 10rem),
          linear-gradient(180deg, #07111f 0%, #10243f 58%, #172532 100%);
        --steam: #77839a;
        --hover-panel: rgba(25, 38, 62, 0.92);
        --hover-border: rgba(216, 227, 255, 0.42);
        --train-glow: 0 0 18px rgba(255, 219, 135, 0.48);
        --moon-opacity: 1;
        --stars-opacity: 1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--sky);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        filter: drop-shadow(var(--train-glow));
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 0;
        color: var(--steam);
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .mute-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .mute-toggle:hover {
        background: var(--hover-panel);
        border-color: var(--hover-border);
        transform: translateY(-1px);
      }

      .mute-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      .theme-toggle {
        right: 64px;
      }

      .night-sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: var(--stars-opacity);
        pointer-events: none;
        transition: opacity 400ms ease;
      }

      .night-sky::before {
        position: absolute;
        top: 12vh;
        right: 18vw;
        width: clamp(42px, 8vw, 72px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #f8d981;
        box-shadow:
          0 0 26px rgba(248, 217, 129, 0.42),
          inset -12px -8px 0 rgba(214, 166, 74, 0.22);
        content: "";
        opacity: var(--moon-opacity);
      }

      .night-sky::after {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.92) 0 1px, transparent 1.4px),
          radial-gradient(circle, rgba(203, 220, 255, 0.72) 0 1px, transparent 1.4px);
        background-position:
          7vw 14vh,
          18vw 9vh;
        background-size:
          23vw 22vh,
          31vw 26vh;
        content: "";
      }

      .horizon {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 0;
        height: 16vh;
        min-height: 84px;
        opacity: var(--stars-opacity);
        pointer-events: none;
        transition: opacity 400ms ease;
      }

      .horizon::before {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 60%;
        background:
          linear-gradient(90deg, transparent 0 8%, #111929 8% 13%, transparent 13% 18%, #121d30 18% 28%, transparent 28% 34%, #0e1727 34% 44%, transparent 44% 52%, #121d30 52% 61%, transparent 61% 69%, #0e1727 69% 75%, transparent 75% 100%),
          linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.22));
        content: "";
      }

      .horizon::after {
        position: absolute;
        bottom: 32px;
        left: 10vw;
        width: 3px;
        height: 3px;
        border-radius: 1px;
        background: rgba(255, 218, 119, 0.72);
        box-shadow:
          7vw 18px rgba(255, 218, 119, 0.52),
          17vw 4px rgba(255, 218, 119, 0.58),
          28vw 20px rgba(255, 218, 119, 0.5),
          42vw 2px rgba(255, 218, 119, 0.62),
          55vw 16px rgba(255, 218, 119, 0.48),
          69vw 8px rgba(255, 218, 119, 0.56),
          82vw 22px rgba(255, 218, 119, 0.46);
        content: "";
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="night-sky" aria-hidden="true"></div>
      <div class="horizon" aria-hidden="true"></div>

      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <button
        class="mute-toggle theme-toggle"
        id="theme"
        type="button"
        aria-label="Switch to night mode"
        aria-pressed="false"
      >
        🌙
      </button>

      <button
        class="mute-toggle"
        id="mute"
        type="button"
        aria-label="Mute"
        aria-pressed="false"
      >
        🔊
      </button>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const themeButton = document.querySelector("#theme");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";
      const savedTheme = localStorage.getItem("wtc:theme");
      let theme =
        savedTheme === "night" || savedTheme === "day"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "night"
            : "day";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function syncThemeButton() {
        const isNight = theme === "night";
        document.documentElement.dataset.theme = theme;
        themeButton.textContent = isNight ? "☀️" : "🌙";
        themeButton.setAttribute(
          "aria-label",
          isNight ? "Switch to day mode" : "Switch to night mode",
        );
        themeButton.setAttribute("aria-pressed", String(isNight));
        themeColor.setAttribute("content", isNight ? "#07111f" : "#ffffff");
        localStorage.setItem("wtc:theme", theme);
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });

      themeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        theme = theme === "night" ? "day" : "night";
        syncThemeButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        } else if (event.key === "n" || event.key === "N") {
          theme = theme === "night" ? "day" : "night";
          syncThemeButton();
        }
      });

      syncThemeButton();
      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
