<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfa" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
        --button-hover: #fff;
        --steam: #c9c9c7;
        --track: rgba(21, 21, 21, 0.12);
        --track-glow: rgba(21, 21, 21, 0.06);
      }

      body[data-theme="night"] {
        color-scheme: dark;
        --ink: #f4f7fb;
        --muted: #a7b6c8;
        --faint: rgba(178, 202, 230, 0.3);
        --paper: #07111f;
        --panel: rgba(12, 24, 41, 0.74);
        --accent: #9bd7ff;
        --button-hover: rgba(34, 55, 82, 0.86);
        --steam: #8fa5bb;
        --track: rgba(178, 202, 230, 0.22);
        --track-glow: rgba(105, 181, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 120%, var(--track-glow), transparent 42%),
          var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
        transition:
          background-color 220ms ease,
          color 220ms ease;
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      main::after {
        position: fixed;
        right: 0;
        bottom: 58px;
        left: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--track), transparent);
        content: "";
        pointer-events: none;
      }

      .night-sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body[data-theme="night"] .night-sky {
        opacity: 1;
      }

      .moon {
        position: absolute;
        top: 11vh;
        right: clamp(34px, 12vw, 150px);
        width: clamp(42px, 7vw, 74px);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 36% 34%, #fff8ca 0 12%, transparent 13%),
          radial-gradient(circle at 62% 58%, #d8e8f8 0 10%, transparent 11%),
          #f6f1cf;
        box-shadow: 0 0 32px rgba(201, 228, 255, 0.4);
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.9) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(155, 215, 255, 0.85) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(255, 255, 255, 0.75) 0 1px, transparent 1.5px);
        background-position:
          8vw 12vh,
          22vw 24vh,
          72vw 18vh;
        background-size:
          190px 120px,
          240px 160px,
          170px 140px;
      }

      .signal {
        position: fixed;
        bottom: 60px;
        left: clamp(28px, 7vw, 86px);
        width: 8px;
        height: 42px;
        border-radius: 999px 999px 0 0;
        background: rgba(117, 136, 154, 0.46);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .signal::before {
        position: absolute;
        top: -8px;
        left: 50%;
        width: 13px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #8dffb0;
        box-shadow: 0 0 18px rgba(141, 255, 176, 0.72);
        content: "";
        transform: translateX(-50%);
      }

      body[data-theme="night"] .signal {
        opacity: 1;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 2;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 1;
        color: var(--steam);
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }

      .icon-toggle {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .icon-toggle:hover {
        background: var(--button-hover);
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .icon-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="night-sky" aria-hidden="true">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="signal"></div>
      </div>

      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <div class="controls">
        <button
          class="icon-toggle"
          id="theme"
          type="button"
          aria-label="Switch to night mode"
          aria-pressed="false"
        >
          🌙
        </button>

        <button
          class="icon-toggle"
          id="mute"
          type="button"
          aria-label="Mute"
          aria-pressed="false"
        >
          🔊
        </button>
      </div>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const themeButton = document.querySelector("#theme");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";
      let theme = localStorage.getItem("wtc:theme") || "light";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function syncTheme() {
        const night = theme === "night";
        document.body.dataset.theme = theme;
        themeButton.textContent = night ? "☀️" : "🌙";
        themeButton.setAttribute(
          "aria-label",
          night ? "Switch to day mode" : "Switch to night mode",
        );
        themeButton.setAttribute("aria-pressed", String(night));
        themeMeta.setAttribute("content", night ? "#07111f" : "#fbfbfa");
        localStorage.setItem("wtc:theme", theme);
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      themeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        theme = theme === "night" ? "light" : "night";
        syncTheme();
      });

      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        } else if (event.key === "n" || event.key === "N") {
          theme = theme === "night" ? "light" : "night";
          syncTheme();
        }
      });

      syncTheme();
      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
