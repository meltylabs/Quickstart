<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
        --steam: #c9c9c7;
        --sky: #fbfbfa;
        --skyline: rgba(42, 42, 42, 0.08);
        --window-light: rgba(255, 201, 92, 0);
      }

      :root[data-theme="night"] {
        color-scheme: dark;
        --ink: #f4f0de;
        --muted: #b9b0a2;
        --faint: rgba(255, 255, 255, 0.18);
        --paper: #0c1020;
        --panel: rgba(17, 21, 37, 0.76);
        --accent: #ffd36f;
        --steam: #8991a8;
        --sky: linear-gradient(180deg, #090d1a 0%, #151d35 58%, #20283c 100%);
        --skyline: rgba(5, 8, 15, 0.62);
        --window-light: rgba(255, 207, 109, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--sky);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      main::before,
      main::after {
        position: fixed;
        inset: 0;
        display: block;
        content: "";
        pointer-events: none;
        transition: opacity 350ms ease;
      }

      main::before {
        opacity: 0;
        background-image:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.86) 0 1px, transparent 2px),
          radial-gradient(circle at 42% 12%, rgba(255, 255, 255, 0.72) 0 1px, transparent 2px),
          radial-gradient(circle at 68% 22%, rgba(255, 255, 255, 0.8) 0 1px, transparent 2px),
          radial-gradient(circle at 82% 15%, rgba(255, 255, 255, 0.62) 0 1px, transparent 2px),
          radial-gradient(circle at 74% 38%, rgba(255, 255, 255, 0.58) 0 1px, transparent 2px),
          radial-gradient(circle at 28% 34%, rgba(255, 255, 255, 0.6) 0 1px, transparent 2px);
      }

      main::after {
        top: auto;
        height: 25vh;
        opacity: 0.24;
        background:
          linear-gradient(to top, var(--skyline), transparent 86%),
          linear-gradient(90deg, transparent 0 6%, var(--skyline) 6% 12%, transparent 12% 18%, var(--skyline) 18% 28%, transparent 28% 35%, var(--skyline) 35% 43%, transparent 43% 54%, var(--skyline) 54% 63%, transparent 63% 70%, var(--skyline) 70% 84%, transparent 84%),
          radial-gradient(circle at 9% 58%, var(--window-light) 0 2px, transparent 3px),
          radial-gradient(circle at 23% 50%, var(--window-light) 0 2px, transparent 3px),
          radial-gradient(circle at 39% 62%, var(--window-light) 0 2px, transparent 3px),
          radial-gradient(circle at 59% 48%, var(--window-light) 0 2px, transparent 3px),
          radial-gradient(circle at 78% 58%, var(--window-light) 0 2px, transparent 3px);
      }

      :root[data-theme="night"] main::before {
        opacity: 1;
      }

      :root[data-theme="night"] main::after {
        opacity: 1;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 0;
        color: var(--steam);
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .mute-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .mute-toggle:hover {
        background: #fff;
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      :root[data-theme="night"] .mute-toggle:hover {
        background: rgba(30, 36, 58, 0.94);
        border-color: rgba(255, 255, 255, 0.34);
      }

      .mute-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .theme-toggle {
        right: 62px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <button
        class="mute-toggle theme-toggle"
        id="theme"
        type="button"
        aria-label="Switch to night mode"
        aria-pressed="false"
      >
        🌙
      </button>

      <button
        class="mute-toggle"
        id="mute"
        type="button"
        aria-label="Mute"
        aria-pressed="false"
      >
        🔊
      </button>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;
      const THEME_STORAGE_KEY = "wtc:theme";

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const themeButton = document.querySelector("#theme");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";
      let storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      let theme = storedTheme || (systemTheme.matches ? "night" : "day");

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function syncTheme() {
        const isNight = theme === "night";
        document.documentElement.dataset.theme = theme;
        themeButton.textContent = isNight ? "☀️" : "🌙";
        themeButton.setAttribute(
          "aria-label",
          isNight ? "Switch to day mode" : "Switch to night mode",
        );
        themeButton.setAttribute("aria-pressed", String(isNight));
        themeColor.setAttribute("content", isNight ? "#0c1020" : "#ffffff");
      }

      function setTheme(nextTheme, persist = true) {
        theme = nextTheme;
        if (persist) {
          storedTheme = nextTheme;
          localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        }
        syncTheme();
      }

      function toggleTheme() {
        setTheme(theme === "night" ? "day" : "night");
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });
      themeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleTheme();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        } else if (event.key === "n" || event.key === "N") {
          toggleTheme();
        }
      });

      systemTheme.addEventListener("change", (event) => {
        if (storedTheme) return;
        setTheme(event.matches ? "night" : "day", false);
      });

      syncTheme();
      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
