<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-hover: #fff;
        --accent: #111;
        --steam: #c9c9c7;
        --sky-glow: rgba(255, 255, 255, 0);
        --horizon: rgba(218, 218, 214, 0.55);
        --rail: rgba(21, 21, 21, 0.14);
        --star: rgba(255, 255, 255, 0);
        --moon: rgba(255, 255, 255, 0);
        --window: rgba(255, 255, 255, 0);
      }

      body.night {
        --ink: #eef3ff;
        --muted: #9eacc4;
        --faint: #31405b;
        --paper: #0c1324;
        --panel: rgba(16, 25, 45, 0.76);
        --panel-hover: rgba(28, 40, 66, 0.92);
        --accent: #f4cf62;
        --steam: #b8c5d9;
        --sky-glow: rgba(244, 207, 98, 0.12);
        --horizon: rgba(65, 85, 120, 0.32);
        --rail: rgba(226, 234, 249, 0.2);
        --star: rgba(245, 248, 255, 0.88);
        --moon: #f4cf62;
        --window: rgba(255, 214, 108, 0.85);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 76% 18%, var(--sky-glow), transparent 26vw),
          linear-gradient(180deg, var(--paper) 0%, var(--paper) 68%, var(--horizon) 100%);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
        transition:
          background 250ms ease,
          color 250ms ease;
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .night-scene {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 250ms ease;
      }

      body.night .night-scene {
        opacity: 1;
      }

      .moon {
        position: absolute;
        top: clamp(34px, 8vh, 82px);
        right: clamp(34px, 9vw, 118px);
        width: clamp(46px, 8vw, 78px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--moon);
        box-shadow:
          0 0 34px rgba(244, 207, 98, 0.28),
          inset -14px -9px 0 rgba(132, 103, 43, 0.12);
      }

      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--star);
        box-shadow: 0 0 8px var(--star);
      }

      .star:nth-child(2) {
        top: 17%;
        left: 13%;
      }

      .star:nth-child(3) {
        top: 11%;
        left: 36%;
        width: 2px;
        height: 2px;
      }

      .star:nth-child(4) {
        top: 28%;
        left: 63%;
      }

      .star:nth-child(5) {
        top: 41%;
        left: 21%;
        width: 2px;
        height: 2px;
      }

      .star:nth-child(6) {
        top: 34%;
        right: 18%;
      }

      .track {
        position: fixed;
        left: -4vw;
        right: -4vw;
        height: 1px;
        z-index: 0;
        background: linear-gradient(90deg, transparent, var(--rail), transparent);
        opacity: 0.75;
        pointer-events: none;
      }

      .track.lane-1 {
        top: calc(10vh + 48px);
      }

      .track.lane-2 {
        top: calc(26vh + 48px);
      }

      .track.lane-3 {
        top: calc(42vh + 48px);
      }

      .track.lane-4 {
        top: calc(58vh + 48px);
      }

      .track.lane-5 {
        top: calc(74vh + 48px);
      }

      .signal {
        position: fixed;
        right: clamp(18px, 5vw, 64px);
        bottom: 50px;
        z-index: 0;
        width: 34px;
        height: 84px;
        border-bottom: 34px solid rgba(55, 64, 82, 0.52);
        opacity: 0;
        pointer-events: none;
        transition: opacity 250ms ease;
      }

      body.night .signal {
        opacity: 1;
      }

      .signal::before,
      .signal::after {
        position: absolute;
        content: "";
        left: 50%;
        transform: translateX(-50%);
      }

      .signal::before {
        top: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--window);
        box-shadow: 0 0 20px rgba(255, 214, 108, 0.42);
      }

      .signal::after {
        top: 20px;
        width: 4px;
        height: 44px;
        background: rgba(106, 117, 139, 0.5);
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 0;
        color: var(--steam);
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .mute-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .mute-toggle:hover {
        background: var(--panel-hover);
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }

      .controls .mute-toggle {
        position: static;
      }

      .mute-toggle:focus-visible,
      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .theme-toggle {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .theme-toggle:hover {
        background: var(--panel-hover);
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="night-scene" aria-hidden="true">
        <span class="moon"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
      </div>
      <span class="track lane-1" aria-hidden="true"></span>
      <span class="track lane-2" aria-hidden="true"></span>
      <span class="track lane-3" aria-hidden="true"></span>
      <span class="track lane-4" aria-hidden="true"></span>
      <span class="track lane-5" aria-hidden="true"></span>
      <span class="signal" aria-hidden="true"></span>

      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <div class="controls">
        <button
          class="theme-toggle"
          id="theme"
          type="button"
          aria-label="Switch to night mode"
          aria-pressed="false"
        >
          🌙
        </button>

        <button
          class="mute-toggle"
          id="mute"
          type="button"
          aria-label="Mute"
          aria-pressed="false"
        >
          🔊
        </button>
      </div>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const muteButton = document.querySelector("#mute");
      const themeButton = document.querySelector("#theme");
      const counter = document.querySelector("#counter");
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";
      let nightMode = localStorage.getItem("wtc:theme") === "night";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function syncThemeButton() {
        document.body.classList.toggle("night", nightMode);
        themeMeta.setAttribute("content", nightMode ? "#0c1324" : "#ffffff");
        themeButton.textContent = nightMode ? "☀️" : "🌙";
        themeButton.setAttribute(
          "aria-label",
          nightMode ? "Switch to day mode" : "Switch to night mode",
        );
        themeButton.setAttribute("aria-pressed", String(nightMode));
        localStorage.setItem("wtc:theme", nightMode ? "night" : "day");
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });
      themeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        nightMode = !nightMode;
        syncThemeButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        } else if (event.key === "n" || event.key === "N") {
          nightMode = !nightMode;
          syncThemeButton();
        }
      });

      syncMuteButton();
      syncThemeButton();
      updateCounter();
    </script>
  </body>
</html>
