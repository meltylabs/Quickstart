<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .train.ttb {
        animation-name: train-ttb;
      }

      .train.btt {
        animation-name: train-btt;
      }

      .train.tlbr {
        animation-name: train-tlbr;
      }

      .train.trbl {
        animation-name: train-trbl;
      }

      .train.brtl {
        animation-name: train-brtl;
      }

      .train.bltr {
        animation-name: train-bltr;
      }

      .steam {
        position: fixed;
        z-index: 0;
        color: #c9c9c7;
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .mute-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .mute-toggle:hover {
        background: #fff;
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .mute-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      .milestone {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .milestone.show {
        animation: milestone-pop 1800ms cubic-bezier(0.18, 0.9, 0.24, 1) forwards;
      }

      .milestone-copy {
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        color: var(--ink);
        text-align: center;
        text-shadow:
          0 1px 0 #fff,
          0 10px 36px rgba(0, 0, 0, 0.18);
      }

      .milestone-count {
        font-size: clamp(64px, 18vw, 180px);
        font-weight: 850;
        letter-spacing: 0;
        line-height: 0.9;
      }

      .milestone-label {
        margin-top: 10px;
        color: var(--muted);
        font-size: clamp(15px, 3vw, 24px);
        font-weight: 650;
        letter-spacing: 0;
      }

      .milestone-burst {
        position: absolute;
        inset: 0;
      }

      .milestone-train {
        position: absolute;
        top: var(--y);
        left: -12vw;
        z-index: 1;
        font-size: clamp(28px, 6vw, 58px);
        line-height: 1;
        transform: translateX(-12vw) rotate(var(--tilt));
        animation: milestone-train 1300ms cubic-bezier(0.24, 0.74, 0.34, 1) forwards;
        animation-delay: var(--delay);
        will-change: transform, opacity;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes train-ttb {
        from {
          transform: translateY(-15vh) rotate(90deg);
        }

        to {
          transform: translateY(115vh) rotate(90deg);
        }
      }

      @keyframes train-btt {
        from {
          transform: translateY(115vh) rotate(-90deg);
        }

        to {
          transform: translateY(-15vh) rotate(-90deg);
        }
      }

      @keyframes train-tlbr {
        from {
          transform: translate(-15vw, -15vh) rotate(45deg) scaleX(-1);
        }

        to {
          transform: translate(115vw, 115vh) rotate(45deg) scaleX(-1);
        }
      }

      @keyframes train-trbl {
        from {
          transform: translate(115vw, -15vh) rotate(-45deg);
        }

        to {
          transform: translate(-15vw, 115vh) rotate(-45deg);
        }
      }

      @keyframes train-brtl {
        from {
          transform: translate(115vw, 115vh) rotate(45deg);
        }

        to {
          transform: translate(-15vw, -15vh) rotate(45deg);
        }
      }

      @keyframes train-bltr {
        from {
          transform: translate(-15vw, 115vh) rotate(-45deg) scaleX(-1);
        }

        to {
          transform: translate(115vw, -15vh) rotate(-45deg) scaleX(-1);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @keyframes milestone-pop {
        0% {
          opacity: 0;
          transform: scale(0.82);
        }

        12%,
        72% {
          opacity: 1;
          transform: scale(1);
        }

        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }

      @keyframes milestone-train {
        0% {
          opacity: 0;
          transform: translateX(-12vw) rotate(var(--tilt)) scale(0.8);
        }

        18%,
        72% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translateX(124vw) rotate(var(--tilt)) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover,
        .milestone.show {
          animation: none;
          transition: none;
        }

        .steam,
        .milestone-train {
          display: none;
        }

        .milestone.show {
          opacity: 1;
        }

        .train.ltr,
        .train.rtl,
        .train.ttb,
        .train.btt,
        .train.tlbr,
        .train.trbl,
        .train.brtl,
        .train.bltr {
          left: 50%;
          top: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <button
        class="mute-toggle"
        id="mute"
        type="button"
        aria-label="Mute"
        aria-pressed="false"
      >
        🔊
      </button>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>

      <div class="milestone" id="milestone" aria-live="polite" aria-atomic="true">
        <div class="milestone-copy">
          <div class="milestone-count" id="milestone-count">10</div>
          <div class="milestone-label" id="milestone-label">trains dispatched</div>
        </div>
        <div class="milestone-burst" id="milestone-burst" aria-hidden="true"></div>
      </div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const DIRECTIONS = [
        "ltr",
        "tlbr",
        "ttb",
        "trbl",
        "rtl",
        "brtl",
        "btt",
        "bltr",
      ];
      const HORIZONTAL_LANE_COUNT = 5;
      const VERTICAL_LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;
      const MILESTONE_STEP = 10;
      const MILESTONE_BURST_COUNT = 7;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const milestone = document.querySelector("#milestone");
      const milestoneCount = document.querySelector("#milestone-count");
      const milestoneLabel = document.querySelector("#milestone-label");
      const milestoneBurst = document.querySelector("#milestone-burst");
      const choo = new Audio("./public/choo-choo.mp3");
      const chime = new Audio("./public/sf-muni-inbound-train-chime.mp3");
      choo.preload = "auto";
      chime.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let directionIndex = 0;
      let lastHorizontalLane = -1;
      let lastVerticalLane = -1;
      let milestoneTimer = 0;
      let muted = localStorage.getItem("wtc:muted") === "1";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function playChime() {
        if (muted) return;
        const node = chime.cloneNode(true);
        node.volume = 0.24;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function isVertical(direction) {
        return direction === "ttb" || direction === "btt";
      }

      function isDiagonal(direction) {
        return (
          direction === "tlbr" ||
          direction === "trbl" ||
          direction === "brtl" ||
          direction === "bltr"
        );
      }

      function chooseLane(direction) {
        if (isDiagonal(direction)) return 0;

        const laneCount = isVertical(direction)
          ? VERTICAL_LANE_COUNT
          : HORIZONTAL_LANE_COUNT;
        let lane = Math.floor(Math.random() * laneCount);

        if (isVertical(direction)) {
          if (lane === lastVerticalLane) lane = (lane + 1) % laneCount;
          lastVerticalLane = lane;
        } else {
          if (lane === lastHorizontalLane) lane = (lane + 1) % laneCount;
          lastHorizontalLane = lane;
        }

        return lane;
      }

      function positionTrain(node, train) {
        if (isDiagonal(train.direction)) {
          node.style.left = "0";
          node.style.top = "0";
        } else if (isVertical(train.direction)) {
          node.style.left = `${10 + train.lane * 16}vw`;
          node.style.top = "0";
        } else {
          node.style.left = "0";
          node.style.top = `${10 + train.lane * 16}vh`;
        }
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);

          if (isDiagonal(train.direction)) {
            const reverseX = train.direction === "trbl" || train.direction === "brtl";
            const reverseY = train.direction === "brtl" || train.direction === "bltr";
            const x = reverseX ? 115 - 130 * progress : -15 + 130 * progress;
            const y = reverseY ? 115 - 130 * progress : -15 + 130 * progress;
            puff.style.left = `${x}vw`;
            puff.style.top = `${y}vh`;
          } else if (isVertical(train.direction)) {
            const y =
              train.direction === "ttb"
                ? -15 + 130 * progress
                : 115 - 130 * progress;
            puff.style.left = `${10 + train.lane * 16}vw`;
            puff.style.top = `${y}vh`;
          } else {
            const x =
              train.direction === "ltr"
                ? -15 + 130 * progress
                : 115 - 130 * progress;
            puff.style.left = `${x}vw`;
            puff.style.top = `${10 + train.lane * 16}vh`;
          }

          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function showMilestone(total) {
        milestoneCount.textContent = total;
        milestoneLabel.textContent = `${total === 1 ? "train" : "trains"} dispatched`;
        milestoneBurst.replaceChildren();
        milestone.classList.remove("show");
        window.clearTimeout(milestoneTimer);

        for (let i = 0; i < MILESTONE_BURST_COUNT; i += 1) {
          const train = document.createElement("span");
          train.className = "milestone-train";
          train.textContent = pick(TRAIN_EMOJIS);
          train.style.setProperty("--y", `${12 + i * 12}%`);
          train.style.setProperty("--delay", `${i * 70}ms`);
          train.style.setProperty("--tilt", `${-8 + Math.random() * 16}deg`);
          train.addEventListener("animationend", removeNode, { once: true });
          milestoneBurst.append(train);
        }

        requestAnimationFrame(() => milestone.classList.add("show"));
        milestoneTimer = window.setTimeout(() => {
          milestone.classList.remove("show");
          milestoneBurst.replaceChildren();
        }, 1900);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        const direction = DIRECTIONS[directionIndex % DIRECTIONS.length];
        directionIndex += 1;
        const lane = chooseLane(direction);

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        positionTrain(trainNode, train);
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        if (count % MILESTONE_STEP === 0) {
          showMilestone(count);
          playChime();
        }

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        }
      });

      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
