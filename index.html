<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <script>
      const savedTheme = localStorage.getItem("wtc:theme");
      const prefersNight =
        window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
      document.documentElement.dataset.theme =
        savedTheme ?? (prefersNight ? "night" : "day");
    </script>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
        --steam: #c9c9c7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
        transition:
          background 300ms ease,
          color 300ms ease;
      }

      :root[data-theme="night"] {
        color-scheme: dark;
        --ink: #f5f0dc;
        --muted: #c6bea4;
        --faint: rgba(245, 240, 220, 0.2);
        --paper: #101116;
        --panel: rgba(28, 27, 31, 0.72);
        --accent: #ffe08a;
        --steam: #d9d0b4;
      }

      :root[data-theme="night"] body {
        background:
          radial-gradient(circle at 82% 18%, rgba(255, 224, 138, 0.18), transparent 12rem),
          linear-gradient(180deg, #101116 0%, #171321 52%, #221b1a 100%);
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .night-details {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 300ms ease;
      }

      :root[data-theme="night"] .night-details {
        opacity: 1;
      }

      .moon {
        position: absolute;
        top: clamp(34px, 8vh, 86px);
        right: clamp(76px, 12vw, 150px);
        width: clamp(48px, 7vw, 76px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #ffe08a;
        box-shadow: 0 0 42px rgba(255, 224, 138, 0.35);
      }

      .moon::after {
        position: absolute;
        inset: 8px 0 0 13px;
        border-radius: inherit;
        background: #101116;
        content: "";
      }

      .star {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #fff7c4;
        box-shadow: 0 0 10px rgba(255, 247, 196, 0.6);
        animation: twinkle 2400ms ease-in-out infinite;
      }

      .star:nth-child(2) {
        top: 18%;
        left: 14%;
      }

      .star:nth-child(3) {
        top: 31%;
        left: 28%;
        animation-delay: 700ms;
      }

      .star:nth-child(4) {
        top: 16%;
        left: 54%;
        animation-delay: 1200ms;
      }

      .star:nth-child(5) {
        top: 42%;
        left: 70%;
        animation-delay: 300ms;
      }

      .star:nth-child(6) {
        top: 62%;
        left: 18%;
        animation-delay: 1600ms;
      }

      .sleepy-rails {
        position: absolute;
        right: -8vw;
        bottom: 13vh;
        left: -8vw;
        height: 2px;
        background: rgba(255, 224, 138, 0.26);
        box-shadow:
          0 18px 0 rgba(255, 224, 138, 0.2),
          0 -18px 0 rgba(255, 224, 138, 0.12);
        transform: rotate(-3deg);
      }

      .skyline {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: end;
        justify-content: center;
        gap: clamp(5px, 1.2vw, 12px);
        padding-inline: 5vw;
        opacity: 0.62;
      }

      .building {
        position: relative;
        width: clamp(28px, 6vw, 58px);
        height: var(--height);
        border-radius: 4px 4px 0 0;
        background: rgba(11, 12, 18, 0.72);
      }

      .building::before,
      .building::after {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 1px;
        background: rgba(255, 224, 138, 0.82);
        box-shadow:
          12px 8px 0 rgba(255, 224, 138, 0.52),
          3px 22px 0 rgba(255, 224, 138, 0.42),
          18px 32px 0 rgba(255, 224, 138, 0.64);
        content: "";
      }

      .building::before {
        top: 12px;
        left: 9px;
      }

      .building::after {
        right: 14px;
        bottom: 18px;
        opacity: 0.72;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 0;
        color: var(--steam);
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .top-controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: inline-flex;
        gap: 8px;
      }

      .icon-toggle {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .icon-toggle:hover {
        background: #fff;
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      :root[data-theme="night"] .icon-toggle:hover {
        background: rgba(45, 42, 49, 0.92);
        border-color: rgba(255, 224, 138, 0.42);
      }

      .icon-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.75);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover,
        .star {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="night-details" aria-hidden="true">
        <span class="moon"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="sleepy-rails"></span>
        <span class="skyline">
          <span class="building" style="--height: 13vh"></span>
          <span class="building" style="--height: 19vh"></span>
          <span class="building" style="--height: 15vh"></span>
          <span class="building" style="--height: 23vh"></span>
          <span class="building" style="--height: 17vh"></span>
          <span class="building" style="--height: 12vh"></span>
        </span>
      </div>

      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <div class="top-controls">
        <button
          class="icon-toggle"
          id="theme"
          type="button"
          aria-label="Switch to night mode"
          aria-pressed="false"
        >
          🌙
        </button>

        <button
          class="icon-toggle"
          id="mute"
          type="button"
          aria-label="Mute"
          aria-pressed="false"
        >
          🔊
        </button>
      </div>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const themeButton = document.querySelector("#theme");
      const themeColor = document.querySelector("#theme-color");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const choo = new Audio("./public/choo-choo.mp3");
      choo.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let muted = localStorage.getItem("wtc:muted") === "1";
      let nightMode = document.documentElement.dataset.theme === "night";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function syncThemeButton({ persist = true } = {}) {
        document.documentElement.dataset.theme = nightMode ? "night" : "day";
        themeButton.textContent = nightMode ? "☀️" : "🌙";
        themeButton.setAttribute(
          "aria-label",
          nightMode ? "Switch to day mode" : "Switch to night mode",
        );
        themeButton.setAttribute("aria-pressed", String(nightMode));
        themeColor.setAttribute("content", nightMode ? "#101116" : "#ffffff");
        if (persist) {
          localStorage.setItem("wtc:theme", nightMode ? "night" : "day");
        }
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });

      themeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        nightMode = !nightMode;
        syncThemeButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        } else if (event.key === "n" || event.key === "N") {
          nightMode = !nightMode;
          syncThemeButton();
        }
      });

      syncThemeButton({ persist: false });
      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
