<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A tiny train dispatcher. Click anywhere to send a train chugging across the screen."
    />
    <meta property="og:title" content="welcome to conductor" />
    <meta property="og:description" content="Click anywhere to dispatch a train." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <title>welcome to conductor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #7a7a7a;
        --faint: #d9d9d9;
        --paper: #fbfbfa;
        --panel: rgba(255, 255, 255, 0.72);
        --accent: #111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-feature-settings: "kern";
      }

      main {
        position: relative;
        display: block;
        width: 100vw;
        min-height: 100svh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .hero.dispatched {
        opacity: 0;
      }

      .hero-inner {
        display: grid;
        gap: 18px;
        place-items: center;
      }

      .train-emoji {
        display: inline-block;
        font-size: clamp(56px, 10vw, 96px);
        line-height: 1;
        transform-origin: 50% 60%;
        pointer-events: auto;
      }

      .train-emoji:hover {
        animation: wiggle 600ms ease-in-out;
      }

      .tagline {
        max-width: 28ch;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        letter-spacing: 0;
        line-height: 1.5;
      }

      .train {
        position: fixed;
        left: 0;
        z-index: 1;
        font-size: clamp(38px, 6vw, 56px);
        line-height: 1;
        pointer-events: none;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        will-change: transform;
      }

      .train.ltr {
        animation-name: train-ltr;
      }

      .train.rtl {
        animation-name: train-rtl;
      }

      .steam {
        position: fixed;
        z-index: 0;
        color: #c9c9c7;
        font-size: 18px;
        pointer-events: none;
        animation: puff 1400ms ease-out forwards;
        will-change: transform, opacity;
      }

      .mute-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--faint);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 16px;
        backdrop-filter: blur(14px);
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .mute-toggle:hover {
        background: #fff;
        border-color: #b8b8b8;
        transform: translateY(-1px);
      }

      .mute-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .counter {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: var(--muted);
        font-size: 13px;
        font-weight: 450;
        letter-spacing: 0;
        pointer-events: none;
      }

      .milestone {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        overflow: hidden;
        pointer-events: none;
        animation: milestone-pop 2600ms ease forwards;
      }

      .milestone-copy {
        position: relative;
        z-index: 2;
        display: grid;
        gap: 6px;
        place-items: center;
        padding: 20px 26px;
        color: var(--ink);
        text-align: center;
        text-shadow:
          0 1px 0 #fff,
          0 10px 30px rgba(255, 255, 255, 0.9);
        transform-origin: 50% 70%;
        animation: milestone-copy-bounce 2600ms cubic-bezier(0.2, 0.8, 0.2, 1)
          forwards;
      }

      .milestone-count {
        font-size: clamp(54px, 14vw, 118px);
        font-weight: 850;
        line-height: 0.9;
        letter-spacing: 0;
      }

      .milestone-label {
        color: #363636;
        font-size: clamp(16px, 3vw, 24px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .milestone-train {
        position: absolute;
        left: 0;
        top: calc(50% + 72px);
        z-index: 3;
        font-size: clamp(46px, 9vw, 82px);
        line-height: 1;
        transform: translateX(-18vw) scaleX(-1);
        animation: milestone-train 2600ms cubic-bezier(0.25, 0.8, 0.25, 1)
          forwards;
      }

      .milestone-track {
        position: absolute;
        left: 8vw;
        right: 8vw;
        top: calc(50% + 132px);
        height: 10px;
        border-top: 3px solid #252525;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0 22px,
          #252525 22px 28px
        );
        opacity: 0.16;
        animation: milestone-track 2600ms ease forwards;
      }

      .confetti {
        position: fixed;
        top: -12px;
        width: 8px;
        height: 14px;
        border-radius: 2px;
        opacity: 0;
        animation: confetti-fall var(--fall-duration) ease-out forwards;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }

        25% {
          transform: translateY(-4px) rotate(-6deg);
        }

        75% {
          transform: translateY(-4px) rotate(6deg);
        }
      }

      @keyframes train-ltr {
        from {
          transform: translateX(-15vw) scaleX(-1);
        }

        to {
          transform: translateX(115vw) scaleX(-1);
        }
      }

      @keyframes train-rtl {
        from {
          transform: translateX(115vw);
        }

        to {
          transform: translateX(-15vw);
        }
      }

      @keyframes puff {
        0% {
          opacity: 0.7;
          transform: translate(0, 0) scale(0.8);
        }

        100% {
          opacity: 0;
          transform: translate(0, -40px) scale(1.4);
        }
      }

      @keyframes milestone-pop {
        0% {
          opacity: 0;
        }

        12%,
        78% {
          opacity: 1;
        }

        100% {
          opacity: 0;
        }
      }

      @keyframes milestone-copy-bounce {
        0% {
          opacity: 0;
          transform: translateY(26px) scale(0.82) rotate(-2deg);
        }

        16% {
          opacity: 1;
          transform: translateY(0) scale(1.08) rotate(1deg);
        }

        28%,
        68% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0);
        }

        100% {
          opacity: 0;
          transform: translateY(-18px) scale(0.96) rotate(1deg);
        }
      }

      @keyframes milestone-train {
        0% {
          transform: translateX(-18vw) scaleX(-1) rotate(0);
        }

        20%,
        68% {
          transform: translateX(calc(50vw - 42px)) scaleX(-1) rotate(-2deg);
        }

        100% {
          transform: translateX(118vw) scaleX(-1) rotate(0);
        }
      }

      @keyframes milestone-track {
        0%,
        100% {
          opacity: 0;
        }

        18%,
        78% {
          opacity: 0.16;
        }
      }

      @keyframes confetti-fall {
        0% {
          opacity: 0;
          transform: translate3d(0, -18px, 0) rotate(0deg);
        }

        12% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--drift), 108vh, 0) rotate(var(--spin));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .train-emoji:hover,
        .milestone,
        .milestone-copy,
        .milestone-train,
        .milestone-track,
        .confetti {
          animation: none;
          transition: none;
        }

        .steam {
          display: none;
        }

        .milestone {
          opacity: 1;
        }

        .milestone-copy {
          padding: 18px 22px;
          border: 1px solid var(--faint);
          border-radius: 8px;
          background: var(--panel);
          backdrop-filter: blur(14px);
        }

        .milestone-train,
        .milestone-track,
        .confetti {
          display: none;
        }

        .train.ltr,
        .train.rtl {
          left: 50%;
          animation: fade-blip 1500ms ease both !important;
        }

        @keyframes fade-blip {
          0% {
            opacity: 0;
            transform: translateX(-50%) scale(0.85);
          }

          20%,
          80% {
            opacity: 1;
            transform: translateX(-50%) scale(1);
          }

          100% {
            opacity: 0;
            transform: translateX(-50%) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main id="dispatcher">
      <div class="hero" id="hero">
        <div class="hero-inner">
          <span class="train-emoji" role="img" aria-label="train">🚂</span>
          <span class="tagline">Click anywhere to dispatch a train.</span>
        </div>
      </div>

      <button
        class="mute-toggle"
        id="mute"
        type="button"
        aria-label="Mute"
        aria-pressed="false"
      >
        🔊
      </button>

      <div class="counter" id="counter" aria-live="polite">0 trains dispatched</div>
    </main>

    <script>
      const TRAIN_EMOJIS = ["🚂", "🚃", "🚅", "🚋", "🚄"];
      const PUFF_CHARS = ["·", "°", "・", "∘"];
      const LANE_COUNT = 5;
      const DISPATCH_THROTTLE_MS = 120;
      const PUFF_COUNT = 4;
      const MIN_DURATION_MS = 4500;
      const MAX_DURATION_MS = 7500;
      const MILESTONE_INTERVAL = 10;
      const MILESTONE_DURATION_MS = 2600;
      const CONFETTI_COLORS = ["#f15a24", "#00a6a6", "#ffc857", "#7b61ff", "#111"];

      const dispatcher = document.querySelector("#dispatcher");
      const hero = document.querySelector("#hero");
      const muteButton = document.querySelector("#mute");
      const counter = document.querySelector("#counter");
      const choo = new Audio("./public/choo-choo.mp3");
      const chime = new Audio("./public/sf-muni-inbound-train-chime.mp3");
      choo.preload = "auto";
      chime.preload = "auto";

      let count = 0;
      let nextId = 1;
      let lastDispatch = 0;
      let lastLane = -1;
      let lastDirection = "rtl";
      let activeMilestone = null;
      let muted = localStorage.getItem("wtc:muted") === "1";

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function syncMuteButton() {
        muteButton.textContent = muted ? "🔇" : "🔊";
        muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
        muteButton.setAttribute("aria-pressed", String(muted));
        localStorage.setItem("wtc:muted", muted ? "1" : "0");
      }

      function updateCounter() {
        const noun = count === 1 ? "train" : "trains";
        counter.textContent = `${count} ${noun} dispatched`;
        document.title =
          count === 0 ? "welcome to conductor" : `welcome to conductor (${count})`;
      }

      function playChoo() {
        if (muted) return;
        const node = choo.cloneNode(true);
        node.volume = 0.28;
        node.play().catch(() => {});
      }

      function playChime() {
        if (muted) return;
        const node = chime.cloneNode(true);
        node.volume = 0.2;
        node.play().catch(() => {});
      }

      function removeNode(event) {
        event.currentTarget.remove();
      }

      function createConfetti(parent) {
        for (let i = 0; i < 36; i += 1) {
          const confetti = document.createElement("span");
          const delay = Math.random() * 420;
          const duration = 1600 + Math.random() * 900;
          const drift = -70 + Math.random() * 140;
          const spin = 180 + Math.random() * 540;

          confetti.className = "confetti";
          confetti.style.left = `${Math.random() * 100}vw`;
          confetti.style.background = pick(CONFETTI_COLORS);
          confetti.style.setProperty("--fall-duration", `${duration}ms`);
          confetti.style.setProperty("--drift", `${drift}px`);
          confetti.style.setProperty("--spin", `${spin}deg`);
          confetti.style.animationDelay = `${delay}ms`;
          parent.append(confetti);
        }
      }

      function showMilestone(total) {
        activeMilestone?.remove();

        const milestone = document.createElement("div");
        const copy = document.createElement("div");
        const totalNode = document.createElement("div");
        const label = document.createElement("div");
        const train = document.createElement("span");
        const track = document.createElement("div");

        milestone.className = "milestone";
        milestone.setAttribute("aria-hidden", "true");

        copy.className = "milestone-copy";
        totalNode.className = "milestone-count";
        label.className = "milestone-label";
        train.className = "milestone-train";
        track.className = "milestone-track";

        totalNode.textContent = total;
        label.textContent = "trains dispatched";
        train.textContent = "🚂";

        copy.append(totalNode, label);
        milestone.append(track, copy, train);
        createConfetti(milestone);
        dispatcher.append(milestone);

        activeMilestone = milestone;
        playChime();

        window.setTimeout(() => {
          if (activeMilestone === milestone) activeMilestone = null;
          milestone.remove();
        }, MILESTONE_DURATION_MS);
      }

      function createSteam(train, delay) {
        window.setTimeout(() => {
          const elapsed = performance.now() - train.startedAt;
          const progress = Math.min(elapsed / train.durationMs, 1);
          const puff = document.createElement("span");
          const x =
            train.direction === "ltr"
              ? -15 + 130 * progress
              : 115 - 130 * progress;

          puff.className = "steam";
          puff.textContent = pick(PUFF_CHARS);
          puff.style.left = `${x}vw`;
          puff.style.top = `${10 + train.lane * 16}vh`;
          puff.addEventListener("animationend", removeNode, { once: true });
          dispatcher.append(puff);
        }, delay);
      }

      function dispatchTrain() {
        const now = performance.now();
        if (now - lastDispatch < DISPATCH_THROTTLE_MS) return;
        lastDispatch = now;

        let lane = Math.floor(Math.random() * LANE_COUNT);
        if (lane === lastLane) lane = (lane + 1) % LANE_COUNT;
        lastLane = lane;

        const direction = lastDirection === "ltr" ? "rtl" : "ltr";
        lastDirection = direction;

        const durationMs =
          MIN_DURATION_MS + Math.random() * (MAX_DURATION_MS - MIN_DURATION_MS);
        const train = {
          id: nextId++,
          lane,
          direction,
          durationMs,
          startedAt: now,
        };

        const trainNode = document.createElement("span");
        trainNode.className = `train ${direction}`;
        trainNode.textContent = pick(TRAIN_EMOJIS);
        trainNode.style.top = `${10 + lane * 16}vh`;
        trainNode.style.animationDuration = `${durationMs}ms`;
        trainNode.addEventListener("animationend", removeNode, { once: true });
        dispatcher.append(trainNode);

        count += 1;
        hero.classList.add("dispatched");
        updateCounter();
        if (count % MILESTONE_INTERVAL === 0) showMilestone(count);
        playChoo();

        for (let i = 0; i < PUFF_COUNT; i += 1) {
          createSteam(train, (durationMs / (PUFF_COUNT + 1)) * (i + 1));
        }
      }

      dispatcher.addEventListener("click", dispatchTrain);
      muteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        muted = !muted;
        syncMuteButton();
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          dispatchTrain();
        } else if (event.key === "m" || event.key === "M") {
          muted = !muted;
          syncMuteButton();
        }
      });

      syncMuteButton();
      updateCounter();
    </script>
  </body>
</html>
