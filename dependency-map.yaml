# dependency-map.yaml
# Generated by SDD Enablement Skill — Phase 3 (Light)
# Source: RSG Architecture Wiki (HeartbeatGroup, RegionalGatewayGroup, OnCloudGatewayGroup)
# Date: 2026-07-29
# Scope: RSGGateway + Heartbeat combined enablement

services:
  # ─────────────────────────────────────────────────────────────
  # RegionalGatewayGroup (rsgrg) — account 290447894946
  # ─────────────────────────────────────────────────────────────
  RegionalCloudGateway:
    repo: philips-internal/psi2m-IoTCloud.RegionalCloudGateway
    group: RegionalGatewayGroup
    alias: rsgrg
    type: hub-service
    region: regional
    tech_stack:
      language: Java 17
      framework: Spring Cloud Gateway 4.3.0 (reactive/WebFlux)
      parent_pom: super-pom:3.0.6-RC
      build_tool: Maven
      base_image: ubi8/openjdk-17-runtime:1.23 (ARM64)
    deployment:
      platform: AWS EKS + Cloud Foundry (dual-deploy)
      namespace: rsgrg-{env}
      helm: per-service chart in service repo
      ingress: NGINX Ingress Controller (TLS, cert-manager cluster-ca)
      canary_header: x-sanity-rsgrg
    gateway_routes: 37

    publishes:
      rest:
        # Routes to AssociateManagementGroup (via private ALB)
        - target: AssociateManagementGroup/AssociateManagementService
          endpoint: "/* /associatemanagement/**"
          purpose: Associate management routing
          workflows: [device-management, registration]
        - target: AssociateManagementGroup/InventoryService
          endpoint: "/* /fleet/**"
          purpose: Fleet inventory routing
          workflows: [fleet-management]
        - target: AssociateManagementGroup/GlobalPKIService
          endpoint: "/* /globalPKIProvider/**"
          purpose: Global PKI routing
          workflows: [certificate-management]
        - target: AssociateManagementGroup/PKIProviderService
          endpoint: "/* /pkiProvider/**"
          purpose: PKI provider routing (with device cert + revoke rewrites to AMS)
          workflows: [certificate-management]
        - target: AssociateManagementGroup/ProductManagementService
          endpoint: "/* /configuration/**"
          purpose: Product type configuration
          workflows: [device-provisioning]
        - target: AssociateManagementGroup/DeviceProfileUpdate
          endpoint: "/* /internal/iothub/registration/associateProfileUpdate/**"
          purpose: Device profile update routing
          workflows: [device-profile]
        - target: AssociateManagementGroup/DiscoveryService
          endpoint: "/* /discovery/**"
          purpose: Service discovery routing
          workflows: [service-resolution]
        - target: AssociateManagementGroup/HubUpdateService
          endpoint: "/* /hubUpdate/**"
          purpose: Hub update routing
          workflows: [hub-management]
        - target: AssociateManagementGroup/RAServerService
          endpoint: "/* /ra/**"
          purpose: Remote access server routing
          workflows: [remote-access]
        - target: AssociateManagementGroup/HMPGateway
          endpoint: "/* /deployment/**, /resource/**, /route/fleet/**, /Associates/**, /staticcontent/**"
          purpose: Hub management portal routing
          workflows: [hub-management]

        # Routes to RSMGroup (via private ALB)
        - target: RSMGroup/FirmwareManagementService
          endpoint: "/* /fms/**"
          purpose: Firmware management routing
          workflows: [firmware-distribution]
        - target: RSMGroup/RuleManagementService
          endpoint: "/* /rms/**"
          purpose: Rule management routing
          workflows: [firmware-distribution]
        - target: RSMGroup/DistributionSyncService
          endpoint: "/* /dss/**"
          purpose: Distribution sync routing
          workflows: [firmware-distribution]
        - target: RSMGroup/BusinessActivityMonitoring
          endpoint: "/* /bam/**"
          purpose: BAM routing
          workflows: [monitoring]
        - target: RSMGroup/PublisherGateway
          endpoint: "/* /pgw/**"
          purpose: Publisher gateway routing
          workflows: [firmware-distribution]
        - target: RSMGroup/AssetManagementService
          endpoint: "/* /assetmanagement/**"
          purpose: Asset management routing
          workflows: [asset-management]

        # Routes to FileUploadGroup (via private ALB)
        - target: FileUploadGroup/RSGManagementService
          endpoint: "/* /rsg/**"
          purpose: RSG management routing
          workflows: [file-upload]
        - target: FileUploadGroup/CFODService
          endpoint: "/* /FileOnDemandService/cfod/**"
          purpose: Cloud file on demand routing
          workflows: [file-upload]

        # Routes to External Platform Services (direct, not via ALB)
        - target: External/PRS-DPU
          endpoint: "/* /device-profile/profile/update/**"
          purpose: Device profile update (PRS)
          workflows: [device-profile]
        - target: External/PRS-DPU-Retrieve
          endpoint: "/* /device-profile/profile/retrieve/**"
          purpose: Device profile retrieve (PRS)
          workflows: [device-profile]
        - target: External/PRS-SPU
          endpoint: "/* /device-profile/satellite-devices/**"
          purpose: Satellite profile update (PRS)
          workflows: [device-profile]
        - target: External/PRS-PreProvisioning
          endpoint: "/* /prs/preprovisioning/**"
          purpose: Pre-provisioning (PRS)
          workflows: [registration]
        - target: External/PRS-AlarmService
          endpoint: "/* /create/**"
          purpose: Alarm creation (PRS)
          workflows: [device-alerts]
        - target: External/PRS-TelemetryData
          endpoint: "/* /telemetry/**"
          purpose: Telemetry data (PRS)
          workflows: [telemetry]
        - target: External/PRS-FileTransfer
          endpoint: "/* /file-transfer-activity/**"
          purpose: File transfer activity (PRS)
          workflows: [file-upload]
        - target: External/RPM-PropositionManagement
          endpoint: "/* /iot-rpm/business/producttype/**"
          purpose: Proposition management (RPM)
          workflows: [device-provisioning]

    consumes: []

    convergence_points: []

    security:
      auth: HSDP IAM token introspection (validates OAuth2 on every request)
      rate_limiting:
        - path: /monitor/HeartBeat/devices
          bucket: 50
          refill: 20 per 10s
        - path: /monitor/HeartBeat/Business/*
          bucket: 50
          refill: 50 per 5s
      whitelisted_paths:
        - /FileOnDemandService/cfod/*
        - /fleet/Hubs/*
        - /associatemanagement/Associates/**
        - /prs/preprovisioning/**
        - /iot-rpm/business/producttype/**
        - /device-profile/**
        - /route/fleet/Hubs/$create
        - /Associates/connectivityInfo
        - /rsg/fileupload/file/validation
        - /monitor/HeartBeat
        - /configuration/productType/
        - /discovery/endpoint
        - /fms/iot-rsm/firmware/business/notifications/sync
        - /fms/iot-rsm/firmware/product/notifications/sync
        - /monitor/HeartBeat/Business/*
        - /monitor/HeartBeat/devices

  # ─────────────────────────────────────────────────────────────
  # OnCloudGatewayGroup (rsggh) — account 290447894946
  # ─────────────────────────────────────────────────────────────
  RSGGatewayService:
    repo: (OnCloudGatewayGroup service repo — ECR image 290447894946.dkr.ecr.eu-west-1.amazonaws.com/master/rsg-gateway-service)
    group: OnCloudGatewayGroup
    alias: rsggh
    type: hub-service
    region: regional
    tech_stack:
      language: Java 17
      framework: Spring Cloud Gateway (reactive/WebFlux)
      parent_pom: super-pom:3.0.6-RC
      build_tool: Maven
      base_image: arm64/ubi8/openjdk-17-runtime:1.23
    deployment:
      platform: AWS EKS + Cloud Foundry (dual-deploy)
      namespace: rsggh-{env}
      helm: umbrella chart (IAC repo)
      ingress: NGINX Ingress Controller (external, TLS)
      canary_header: x-sanity-rsggh
      hpa:
        min_replicas: 1
        max_replicas: 20
        cpu_target: 70
        memory_target: 80

    publishes:
      rest:
        - target: Backend/device-profile-update-service
          endpoint: "reverse proxy (DPU paths)"
          purpose: Device profile update traffic from devices
          workflows: [device-profile]
        - target: Backend/get-device-profile-service
          endpoint: "reverse proxy (DPU GET paths)"
          purpose: Device profile retrieval from devices
          workflows: [device-profile]
        - target: Backend/associate-registration-service
          endpoint: "reverse proxy (Registration paths)"
          purpose: Device registration traffic
          workflows: [registration]
        - target: Backend/file-upload-service
          endpoint: "reverse proxy (File upload paths)"
          purpose: Device file uploads
          workflows: [file-upload]
        - target: Backend/remote-software-service
          endpoint: "reverse proxy (Firmware paths)"
          purpose: Firmware download traffic
          workflows: [firmware-distribution]
        - target: Backend/associate-command-handler-service
          endpoint: "reverse proxy (Remote access paths)"
          purpose: Remote access command traffic
          workflows: [remote-access]
        - target: Backend/telemetry-service
          endpoint: "reverse proxy (Telemetry paths)"
          purpose: Device telemetry traffic
          workflows: [telemetry]
        - target: Backend/device-alert-service
          endpoint: "reverse proxy (Alert paths)"
          purpose: Device alert traffic
          workflows: [device-alerts]
        - target: Backend/iotcloud-observability-service
          endpoint: "reverse proxy (Observability paths)"
          purpose: Observability traffic
          workflows: [observability]

    consumes: []

    convergence_points: []

    security:
      auth: HSDP IAM token introspection + Nametag token auth + Registration token (300s expiry)
      rate_limiting:
        engine: Bucket4j + Redisson (Redis JCache)
        rule_count: 39
        note: path-specific rules for all 9 backend routes

  MonitorService:
    repo: (OnCloudGatewayGroup service repo — ECR image 290447894946.dkr.ecr.eu-west-1.amazonaws.com/master/monitor-service)
    group: OnCloudGatewayGroup
    alias: rsggh
    type: service
    region: regional
    tech_stack:
      language: Java 17
      framework: Spring Boot
      parent_pom: super-pom:3.0.6-RC
      build_tool: Maven
      base_image: arm64/ubi8/openjdk-17-runtime:1.23
    deployment:
      platform: AWS EKS + Cloud Foundry (dual-deploy)
      namespace: rsggh-{env}
      ingress: ALB (internal)
      canary_header: x-sanity-rsggh
      hpa:
        min_replicas: 1
        max_replicas: 20
        cpu_target: 70
        memory_target: 80
    api_base_path: /monitor

    publishes:
      rest:
        - target: AssociateManagementGroup/AssociateManagementService
          endpoint: "GET /associatemanagement/Associates (via ams.base.uri)"
          purpose: Associate data for heartbeat correlation
          workflows: [heartbeat-monitoring]
        - target: OnPremManagementGroup/InventoryService
          endpoint: "GET fleet inventory"
          purpose: Hub identification for heartbeat tracking
          workflows: [heartbeat-monitoring]
        - target: External/PRS
          endpoint: "POST connectivity-data"
          purpose: Publish hub connectivity status to PRS
          workflows: [heartbeat-monitoring]

    consumes:
      rabbitmq:
        - queue: iotcloud.monitoringservice.heartbeat.queue.name
          exchange: iotcloud.monitoringservice.exchange.name
          routing_key: (same key bound to both queues — fan-out)
          publisher: RSGScheduler (internal) / devices (external heartbeat events)
          handler_class: (RabbitMQ listener in MonitorService)
          workflows: [heartbeat-monitoring]
        - queue: iotcloud.monitoringservice.rsg.heartbeat.queue.name
          exchange: iotcloud.monitoringservice.exchange.name
          routing_key: (same key bound to both queues — fan-out)
          publisher: RSGScheduler (internal) / devices (external heartbeat events)
          handler_class: (RabbitMQ listener in MonitorService)
          workflows: [heartbeat-monitoring]

    convergence_points: []

  RSGScheduler:
    repo: (OnCloudGatewayGroup service repo — ECR image 290447894946.dkr.ecr.eu-west-1.amazonaws.com/master/rsg-scheduler)
    group: OnCloudGatewayGroup
    alias: rsggh
    type: service
    region: regional
    tech_stack:
      language: Java 17
      framework: Spring Boot
      parent_pom: super-pom:3.0.6-RC
      build_tool: Maven
      base_image: arm64/ubi8/openjdk-17-runtime:1.23
    deployment:
      platform: AWS EKS only (no CF dual-deploy)
      namespace: rsggh-{env}
      hpa:
        min_replicas: 1
        max_replicas: 1
        cpu_target: 70
        memory_target: 80
        custom_metric: rsgscheduler_ingress_controller_requests_rate

    publishes:
      rest:
        - target: AssociateManagementGroup/AssociateManagementService
          endpoint: "GET batch queries"
          purpose: Batch associate queries for heartbeat scheduling
          workflows: [heartbeat-monitoring]
        - target: OnCloudGatewayGroup/MonitorService
          endpoint: "POST /monitor (trigger heartbeat check)"
          purpose: Trigger heartbeat batch processing every 5 minutes
          workflows: [heartbeat-monitoring]
      rabbitmq:
        - exchange: iotcloud.monitoringservice.exchange.name
          routing_key: (single key, fan-out to both queues)
          consumer: MonitorService
          workflows: [heartbeat-monitoring]

    consumes: []

    convergence_points: []

    scheduling:
      - cron: "every 5 minutes"
        purpose: Trigger heartbeat checks across all hubs

  # ─────────────────────────────────────────────────────────────
  # HeartbeatGroup (rsgbridge) — account 851725340602
  # ─────────────────────────────────────────────────────────────
  HeartbeatService:
    repo: philips-internal/HSP_PS_RSGBridge_HeartbeatService
    group: HeartbeatGroup
    alias: rsgbridge
    type: service
    region: regional
    tech_stack:
      language: Java 21
      framework: Spring Boot
      parent_pom: "com.philips.services.rsg.bridge:super-pom:1.0.0-RC"
      build_tool: Maven
      base_image: "docker.eu1.hsdp.io/iot-releases/linux/lambda/java:21"
      virtual_threads: true
    deployment:
      platform: Container (CF Docker / ECS)
      account: "851725340602"
      port: 80
      helm: none
    api_base_path: /a2b/ACM

    publishes:
      rest:
        - target: External/Axeda-PSA
          endpoint: "HTTP (AXEDA_ENDPOINT_EU)"
          purpose: Device heartbeat/polling proxy to legacy Axeda platform
          workflows: [heartbeat-bridge]

    consumes: []

    convergence_points: []

    data_stores:
      dynamodb:
        - table: "{PROJECT_NAME}-{ENV}-DeviceLookup"
          purpose: Device lookup
        - table: "{PROJECT_NAME}-{ENV}-Reporting"
          purpose: Reporting data
        - table: "{PROJECT_NAME}-{ENV}-DeviceInvalidSoapRequest"
          purpose: XML parse error storage with retry
      cache:
        - type: Redis (ElastiCache) + Ehcache (in-process)
          purpose: Device lookup caching (two-tier)

  HeartbeatSchedulerService:
    repo: philips-internal/HSP_PS_RSGBridge_HeartbeatSchedulerService
    group: HeartbeatGroup
    alias: rsgbridge
    type: lambda
    region: regional
    tech_stack:
      language: Java 21
      framework: Spring Cloud Function + AWS Lambda
      parent_pom: "com.philips.services.rsg.bridge:super-pom:1.0.0-RC"
      build_tool: Maven
      base_image: "docker.eu1.hsdp.io/iot-releases/linux/lambda/java:21"
    deployment:
      platform: AWS Lambda (container image)
      account: "851725340602"
      handler: "com.philips.services.iotbridge.heartbeatscheduler.lambda.HeartbeatSchedulerServiceHandler::handleRequest"
      vpc_bound: true

    publishes:
      rest:
        - target: AssociateManagementGroup/AssociateManagementService
          endpoint: "POST /associatemanagement/Associates/HeartBeat"
          purpose: Update associate heartbeat status (EU/US/CN regions)
          workflows: [heartbeat-update]
        - target: Platform/HSP-IAM
          endpoint: "POST OAuth2 token (EU/US/CN)"
          purpose: Token generation for AMS calls per region
          workflows: [heartbeat-update]

    consumes: []

    convergence_points: []

    multi_region:
      regions: [EU, US, CN]
      per_region_config:
        - env_var: HSP_IAM_ENDPOINT_EU / HSP_IAM_ENDPOINT_US / HSP_IAM_ENDPOINT_CN
          purpose: IAM token endpoint
        - env_var: IOT_CLOUD_ENDPOINT_EU / IOT_CLOUD_ENDPOINT_US / IOT_CLOUD_ENDPOINT_CN
          purpose: AMS heartbeat endpoint
      credentials: SSM Parameter Store (per-region OAuth2 creds)

    data_stores:
      cache:
        - type: Redis (ElastiCache)
          purpose: Heartbeat key scanning and state management
          connection_pool:
            max_total: LAMBDA_ELASTICACHE_MAX_TOTAL_CONNECTION
            max_idle: LAMBDA_ELASTICACHE_MAX_IDLE_CONNECTION
            min_idle: LAMBDA_ELASTICACHE_MIN_IDLE_CONNECTION

# ─────────────────────────────────────────────────────────────
# External Dependencies (services outside these 3 ServiceGroups)
# ─────────────────────────────────────────────────────────────
external:
  - name: AssociateManagementGroup/AssociateManagementService
    group: AssociateManagementGroup
    interface: REST
    direction: outbound
    consumers: [MonitorService, RSGScheduler, HeartbeatSchedulerService, RegionalCloudGateway]
    endpoints:
      - "/associatemanagement/Associates/HeartBeat (POST)"
      - "/associatemanagement/Associates (GET batch)"

  - name: OnPremManagementGroup/InventoryService
    group: OnPremManagementGroup
    interface: REST
    direction: outbound
    consumers: [MonitorService]
    endpoints:
      - "Fleet inventory queries"

  - name: HSDP IAM
    group: Platform
    interface: HTTPS OAuth2
    direction: outbound
    consumers: [RegionalCloudGateway, RSGGatewayService, MonitorService, HeartbeatSchedulerService]
    endpoints:
      - "Token introspection (gateways)"
      - "Token generation (HeartbeatScheduler EU/US/CN)"

  - name: Axeda/PSA Platform
    group: External (Legacy)
    interface: HTTP REST
    direction: outbound
    consumers: [HeartbeatService]
    endpoints:
      - "AXEDA_ENDPOINT_EU (heartbeat/polling proxy)"
    notes: "TLS hostname verification DISABLED — known security debt"

  - name: PRS (Philips Remote Services)
    group: External Platform
    interface: HTTP REST
    direction: outbound
    consumers: [MonitorService, RegionalCloudGateway]
    endpoints:
      - "connectivity-data publish (MonitorService)"
      - "/device-profile/**, /prs/preprovisioning/**, /telemetry/**, /create/**, /file-transfer-activity/** (routed by RCG)"

  - name: RPM (Remote Patient Monitoring)
    group: External Platform
    interface: HTTP REST
    direction: outbound
    consumers: [RegionalCloudGateway]
    endpoints:
      - "/iot-rpm/business/producttype/**"

  - name: Private ALB (shared)
    group: Infrastructure
    interface: HTTP
    direction: outbound
    consumers: [RegionalCloudGateway, RSGGatewayService]
    notes: "Both gateways route to backend services via the shared private ALB by path prefix"

# ─────────────────────────────────────────────────────────────
# Messaging Infrastructure
# ─────────────────────────────────────────────────────────────
messaging:
  rabbitmq:
    provider: Amazon MQ (managed, Terraform-provisioned)
    group: OnCloudGatewayGroup
    exchanges:
      - name: iotcloud.monitoringservice.exchange.name
        type: direct
        publishers: [RSGScheduler]
        bindings:
          - queue: iotcloud.monitoringservice.heartbeat.queue.name
            routing_key: "(same key — fan-out to both queues)"
            consumer: MonitorService
          - queue: iotcloud.monitoringservice.rsg.heartbeat.queue.name
            routing_key: "(same key — fan-out to both queues)"
            consumer: MonitorService

# ─────────────────────────────────────────────────────────────
# Shared Libraries
# ─────────────────────────────────────────────────────────────
shared_libraries:
  gateway_group:
    - name: iot-logging
      version: 6.0.0.0-RC
      purpose: Structured logging
    - name: http-abstraction
      version: 6.0.0.1-RC
      purpose: HTTP client utilities
    - name: iot-cloud-reddis-utility
      version: 6.1.0.2-RC
      purpose: Redis connectivity
      note: "RSGScheduler uses 6.0.0.10-RC (version inconsistency)"
    - name: iot-infra-config
      version: 6.1.2.0-RC
      purpose: Infrastructure configuration
    - name: iot-authorization
      version: 6.0.0.4-RC
      purpose: Authorization framework (MonitorService only)
    - name: iot-serviceinfo-provider
      version: 6.0.0.1-RC
      purpose: Service info provider (Gateway + Scheduler)

  heartbeat_group:
    - name: iotbridge-http-abstraction
      version: 2.0.0.1-RC (Service) / 2.0.0.2-RC (Scheduler)
      purpose: HTTP client wrapper

# ─────────────────────────────────────────────────────────────
# Property Resolution Notes
# ─────────────────────────────────────────────────────────────
# HeartbeatGroup: All external endpoints via environment variables (no config files)
#   - AXEDA_ENDPOINT_EU: Axeda platform URL
#   - REDIS_PRIMARY_ENDPOINT / REDIS_READER_ENDPOINT: ElastiCache endpoints
#   - HSP_IAM_ENDPOINT_{EU,US,CN}: IAM per-region endpoints
#   - IOT_CLOUD_ENDPOINT_{EU,US,CN}: AMS per-region endpoints
#   - SSM Parameter Store: /{ENV}/{parameterName} pattern
#
# OnCloudGatewayGroup: Spring Cloud Gateway routes target private ALB
#   - spring.cloud.gateway.routes.*.uri = http://private-alb
#   - RabbitMQ: iotcloud.monitoringservice.exchange.name / queue names from application config
#   - Redis Sentinel endpoints for Bucket4j rate limiting
#
# RegionalGatewayGroup: 37 routes defined in ConfigMap
#   - All internal routes target private ALB: lb://{service-host}
#   - External routes (PRS, RPM) target direct URLs from environment config
