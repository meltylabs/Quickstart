# dependency-map.yaml
# Generated by SDD Enablement Skill — Phase 3
# Source: code scan of 3 service repos + IaC repo + RSG Architecture Wiki
# Date: 2026-05-28
# ServiceGroup: FileUploadGroup (rsgfu)

services:
  FileUpload:
    repo: philips-internal/psi2m-IoTCloud.FileUpload
    type: hub-service
    region: regional
    api_base_path: /iothub/fileTransfer
    ingress_paths:
      - /iothub/fileTransfer/*
      - /internal/iothub/fileTransfer/*
      - /iothub/remoteCommands/*
    hpa:
      min: 1
      max: 20
      cpu_target: 70
      mem_target: 80

    publishes:
      rest:
        - target: CFODService
          endpoint: POST ${base.path.url.cfod}/job/{sessionId}
          purpose: Notify CFOD of file upload completion/status update
          workflows:
            - cfod-file-upload
        - target: PRS
          endpoint: GET ${prs.filetransfer.status.url}/file-transfer-activity/{correlationId}
          purpose: Pull file validation status when CC polls after 60 min timeout
          workflows:
            - file-upload-status-check
        - target: BLR
          endpoint: POST (blob request initiation, presigned URL generation)
          purpose: Initiate multipart upload, generate presigned S3 URLs
          workflows:
            - default-file-upload
            - cfod-file-upload
            - lfod-file-upload
        - target: ControlServiceTopic
          endpoint: POST/PUT (CST command create/update)
          purpose: Send MQTT commands to device (file upload status notification)
          workflows:
            - default-file-upload
            - lfod-file-upload
        - target: ObservabilityService
          endpoint: POST (async observability tracking)
          purpose: Track file upload workflow state transitions
          workflows:
            - default-file-upload
            - cfod-file-upload
            - lfod-file-upload

    consumes:
      rest:
        - endpoint: POST /api/v1/validate-checksum
          publisher: PRS
          handler_class: FileUploadNotificationController
          purpose: PRS callback after file checksum/size validation
          workflows:
            - file-validation-callback
        - endpoint: PUT /api/v1/remote-command-status
          publisher: Device (via CST)
          handler_class: FileUploadNotificationController
          purpose: Device command status submission
          workflows:
            - default-file-upload
            - lfod-file-upload
            - cfod-file-upload

    convergence_points:
      - method: FileUploadService.processFileUpload()
        file: service/FileUploadService.java
        shared_by:
          - default-file-upload
          - lfod-file-upload
          - cfod-file-upload
        note: Registry pattern routes to DefaultFileUploadProcessor, OnDemandLfodFileUploadProcessor, or OnDemandCfodFileUploadProcessor

      - method: FileUploadNotificationService.submitStatus()
        file: service/FileUploadNotificationService.java
        shared_by:
          - default-file-upload (→ ControlServiceTopicService)
          - lfod-file-upload (→ ControlServiceTopicService if enabled)
          - cfod-file-upload (→ CFODService.callCFODdServiceToUpdateStatus())
        note: Different processors have different downstream targets for status submission

      - method: FileUploadUtils.callObservabilityService()
        file: utils/FileUploadUtils.java
        shared_by:
          - default-file-upload
          - lfod-file-upload
          - cfod-file-upload
          - complete-upload
        note: Async utility — uniform behavior across all workflows (low convergence risk)

      - method: FileCompleteUploadService.processCompleteUpload()
        file: service/FileCompleteUploadService.java
        shared_by:
          - default-file-upload
          - lfod-file-upload
          - cfod-file-upload
        note: Handles single-part vs multi-part completion logic

  CFODService:
    repo: philips-internal/psi2m-IoTCloud.CFODService
    type: service
    region: regional
    api_base_path: /FileOnDemandService
    ingress_paths:
      - /FileOnDemandService/*
    hpa:
      min: 1
      max: 2
      cpu_target: 70
      mem_target: 80

    publishes:
      sns:
        - topic: cfod-notification_{region}_{env}
          purpose: Publish file-on-demand events to subscribers
          workflows:
            - cfod-file-on-demand
      rest:
        - target: AssociateManagementService
          endpoint: REST (device validation)
          purpose: Validate device association before accepting CFOD request
          workflows:
            - cfod-file-on-demand

    consumes:
      rest:
        - endpoint: POST /FileOnDemandService/* (various endpoints)
          publisher: HSP Platform (external)
          handler_class: (CFOD controllers)
          purpose: File-on-demand trigger from platform
          workflows:
            - cfod-file-on-demand

    convergence_points: []

  RSGManagementService:
    repo: philips-internal/psi2m-IoTCloud.RSGManagementService
    type: service
    region: regional
    api_base_paths:
      - /rsg/endPoint
      - /rsg/fileupload/file/validation
    ingress_paths:
      - /rsg/endPoint/*
      - /rsg/fileupload/file/validation/*
    hpa:
      min: 1
      max: 2
      cpu_target: 70
      mem_target: 80
    databases: []
    note: Stateless service — Redis-only (no database)

    publishes:
      rest:
        - target: FileUpload
          endpoint: REST (checksum validation trigger)
          purpose: Route validation requests to FileUpload service
          workflows:
            - endpoint-resolution
        - target: DiscoveryService
          endpoint: REST (service discovery)
          purpose: Resolve RSG endpoint addresses
          workflows:
            - endpoint-resolution

    consumes:
      rest:
        - endpoint: GET/POST /rsg/endPoint/*
          publisher: Device/Platform (external)
          handler_class: (RSGManagement controllers)
          purpose: Endpoint resolution requests from devices
          workflows:
            - endpoint-resolution
        - endpoint: POST /rsg/fileupload/file/validation/*
          publisher: Device/Platform (external)
          handler_class: (RSGManagement controllers)
          purpose: File checksum validation routing
          workflows:
            - file-validation-routing

    convergence_points: []

# Infrastructure
infrastructure:
  database:
    type: Aurora PostgreSQL
    schemas:
      - fileupload_service_schema (used by: FileUpload)
      - cfod_service_schema (used by: CFODService)
  cache:
    type: Redis Sentinel
    used_by: [FileUpload, CFODService, RSGManagementService]
  storage:
    type: S3
    encryption: KMS
    features: [versioned, EventBridge notifications]
    used_by: [FileUpload]
  messaging:
    sns:
      topics:
        - name: cfod-notification_{region}_{env}
          publisher: CFODService
          encryption: KMS
          multi_tenant: true (per-business prefix)
    rabbitmq:
      status: DEAD_DEPENDENCY
      note: spring-boot-starter-amqp in FileUpload pom.xml but zero listeners/publishers in code

# External Dependencies (services outside this ServiceGroup)
external:
  - name: AssociateManagementService
    group: AssociateManagementGroup
    interface: REST
    direction: outbound
    used_by: [FileUpload, CFODService, RSGManagementService]
    purpose: Device association validation

  - name: RegistrationService
    group: AssociateManagementGroup
    interface: REST
    direction: outbound
    used_by: [FileUpload]
    purpose: Device identity verification

  - name: PRS (File Transfer)
    group: Platform
    interface: REST
    direction: bidirectional
    used_by: [FileUpload]
    purpose: File validation (outbound status pull + inbound checksum callback)

  - name: BLR (Blob Repository)
    group: Platform
    interface: REST
    direction: outbound
    used_by: [FileUpload]
    purpose: S3 presigned URL generation, multipart upload orchestration

  - name: ControlServiceTopic
    group: Platform
    interface: REST → MQTT
    direction: outbound
    used_by: [FileUpload]
    purpose: Device command publishing (file upload status notifications)

  - name: ObservabilityService
    group: Platform
    interface: REST
    direction: outbound
    used_by: [FileUpload, CFODService]
    purpose: Workflow state tracking

  - name: DiscoveryService
    group: Platform
    interface: REST
    direction: outbound
    used_by: [RSGManagementService]
    purpose: RSG endpoint resolution

  - name: HSDP IAM
    group: Platform
    interface: REST
    direction: outbound
    used_by: [FileUpload, CFODService, RSGManagementService]
    purpose: OAuth2 token introspection

  - name: HSDP Vault
    group: Platform
    interface: REST
    direction: outbound
    used_by: [FileUpload, CFODService, RSGManagementService]
    purpose: Dynamic secret injection

  - name: ConnectIoT
    group: Platform
    interface: OAuth2
    direction: inbound
    used_by: [FileUpload]
    purpose: Device onboarding scope grants

# Property Resolution Notes
# - ${base.path.url.cfod} → Resolved from application.yml (CFOD service base URL)
# - ${prs.filetransfer.status.url} → PRS file transfer status endpoint (environment-specific)
# - ${prs.filetranfer.call.time} → 60 minutes (threshold before proactive PRS status pull)
# - ${data.access.url.expiry.time.in.sec} → 1800 seconds (S3 presigned URL validity)
# - SNS topic names resolved in IaC: provisioning/sns.tf → {business}_v1_cfod-notification_{region}_{env}
